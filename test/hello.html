<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="myApp">
            <h1>Famous Todo App</h1>

            <div class="todoTop">
                <input type="text" class="todoInput" placeholder="Add a new task...">
                <button class="addTask">Add Task</button>
            </div>

            <div class="notification">
                <p>Please enter a task before adding.</p>
            </div>

            <div class="todoList">
                <ul class="taskList">
                    <!-- Tasks will be dynamically added here -->
                     <!-- <li>Hello, World!</li>
                     <li>Hello, World!</li>
                     <li>Hello, World!</li>
                     <li>Hello, World!</li>
                     <li>Hello, World!</li> -->
                </ul>
            </div>
        </div>
    </div>
    
    <script src="/test/script.js"></script>
</body>
</html>
