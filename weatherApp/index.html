<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weatherApp">
        <header class="weather">
            <h1 class="brand">Famous Weather App</h1>
            <input class="citySearch" type="text" placeholder="Search for any City">

            <div class="cityInfo">
                <span class="city">
                    <span>
                        <h1 class="cityName">--</h1>
                    <span class="chance">Chance of Rain <span class="percent">0%</span></span>
                    <h2 class="degree">--</h2>
                    </span>
                    
                <img src="img/cloudy-fill (1).svg" alt="cloud image" height="300">
                </span>
            </div>

            <div class="forecast">
                <div class="cityForecast">
                    <h3>Today's Forecast</h3>
                    <span class="forecastInfo">
                        <span class="data">
                            <p class="time">--</p>
                            <img src="img/cloudy-fill (1).svg" alt="cloudy image">
                            <p class="forcastDegree">--</p>
                        </span>
                        <span class="data">
                            <p class="time">--</p>
                            <img src="img/cloudy-fill (1).svg" alt="cloudy image">
                            <p class="forcastDegree">--</p>
                        </span>
                        <span class="data">
                            <p class="time">--</p>
                            <img src="img/cloudy-fill (1).svg" alt="cloudy image">
                            <p class="forcastDegree">--</p>
                        </span>
                        <span class="data">
                            <p class="time">--</p>
                            <img src="img/cloudy-fill (1).svg" alt="cloudy image">
                            <p class="forcastDegree">--</p>
                        </span>
                        <span class="data">
                            <p class="time">--</p>
                            <img src="img/cloudy-fill (1).svg" alt="cloudy image">
                            <p class="forcastDegree">--</p>
                        </span>
                    </span>
                </div>
            </div>
        </header>
    </main>
    <script src="myscript.js"></script>
</body>
</html>
